services:
  - type: web
    name: yepper-creators-video-worker
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run worker
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://yepper.cc,https://www.yepper.cc
      - key: MAX_AD_VIDEO_SIZE_MB
        value: "100"
      - key: MAX_AWS_AD_VIDEO_SIZE_GB
        value: "100"
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_VIDEO_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_MEDIACONVERT_ROLE_ARN
        sync: false
      - key: AWS_MEDIACONVERT_ENDPOINT
        sync: false
      - key: PROCESSING_BUDGET_PERCENT_OF_COMMISSION
        value: "10"
      - key: PROCESSING_COST_PER_MIN_USD
        sync: false
      - key: USD_RWF_RATE
        sync: false
      - key: AD_VIDEO_PRIORITY_FEE_RWF
        value: "0"
      - key: FRONTEND_URL
        value: https://yepper.cc
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: VID_CLOUDINARY_NAME
        sync: false
      - key: VID_CLOUDINARY_KEY
        sync: false
      - key: VID_CLOUDINARY_API_SECRET
        sync: false
